name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# 可选密钥：GOANYAPI_API_KEY、TRUSTMRR_API_KEY、GSC_TOKEN_JSON。
# QQ 日报邮件：SMTP_USERNAME、SMTP_PASSWORD、RADAR_EMAIL_TO。
# 邮件仅在 daily 任务中发送，sources 快讯不发送。
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over, so download the "radar-state" artifact now and then if you care
# about the review's history.

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # sources
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        description: "daily or sources"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * * *' && 'daily' || 'sources') }}
      RADAR_MODE: ${{ vars.RADAR_MODE || 'free' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          # 免费模式明确跳过付费功能；完整模式必须主动选择并配置密钥。
          sources_skip="x,judge"
          daily_skip="x,hf,newsites,revenue,asks,gsc,review,judge,usecases,tutorials"
          if [ "$RADAR_MODE" = "full" ]; then
            if [ -z "$AISA_API_KEY" ]; then
              echo "::error::完整模式需要先配置 AISA_API_KEY。"
              exit 1
            fi
            sources_skip=""
            # 上游仍记录新站接口异常，暂时跳过该信号。
            daily_skip="x,hf,newsites"
          elif [ "$RADAR_MODE" != "free" ]; then
            echo "::error::RADAR_MODE 只能为 free 或 full。"
            exit 1
          fi
          printf '### 运行配置\n\n模式：`%s`；任务：`%s`。免费模式不包含关键词搜索量、竞争分析及 Trends 复盘。\n\n' "$RADAR_MODE" "$COMMAND" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip "$daily_skip" --out report.md
          else
            python -m radar sources --skip "$sources_skip" --out report.md
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 发送 QQ 日报邮件
        if: env.COMMAND == 'daily'
        env:
          RADAR_MAIL_PROVIDER: qq
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from radar import notify

          day = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          result = notify.send(f"新词雷达日报 · {day}", Path("report.md").read_text())
          if result.startswith(("邮件未发送", "mail skipped:")):
              print("::warning::日报已生成，但邮件未发送。请检查 SMTP_USERNAME、SMTP_PASSWORD 和 RADAR_EMAIL_TO。")
          else:
              print(result)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\n\n### 邮件状态\n\n{result}\n")
          PY

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/
          if-no-files-found: ignore
          retention-days: 30
